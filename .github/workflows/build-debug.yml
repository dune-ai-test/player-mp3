name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail
          if [ ! -s ./gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Gradle wrapper jar missing - bootstrapping..."
            curl -fsSL -o /tmp/gradle-bin.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
            unzip -q /tmp/gradle-bin.zip -d /tmp
            /tmp/gradle-8.9/bin/gradle wrapper --gradle-version 8.9 --distribution-type bin
          fi
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: player-mp3-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error